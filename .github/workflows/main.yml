name: Predictive Maintenance Pipeline

on:
  push:
    branches:
      - main

jobs:

  register-dataset:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install -r Predictive_Maintenance/requirements.txt

      - name: Register Dataset to HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python Predictive_Maintenance/model_building/data_register.py

  data-preparation:
    needs: register-dataset
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install -r Predictive_Maintenance/requirements.txt

      - name: Run Data Preparation
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python Predictive_Maintenance/model_building/prep.py

  model-training:
    needs: data-preparation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install -r Predictive_Maintenance/requirements.txt

      - name: Train Model
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python Predictive_Maintenance/model_building/model_experiment.py

  model-registration:
    needs: model-training
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install -r Predictive_Maintenance/requirements.txt

      - name: Upload Model To HF Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python Predictive_Maintenance/model_building/model_registration.py

  deployment:
    needs: model-registration
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install -r Predictive_Maintenance/requirements.txt

      - name: Deploy to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python Predictive_Maintenance/hosting/hosting.py
